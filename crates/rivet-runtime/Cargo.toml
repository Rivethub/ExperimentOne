[package]
name = "rivet-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Local supervisor: API, ingest, MCP, workers, proxy sidecar"
default-run = "rivetd"

[lints]
workspace = true

[[bin]]
name = "rivetd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rivet-api.workspace = true
rivet-core.workspace = true
rivet-export.workspace = true
rivet-ingest.workspace = true
rivet-mcp.workspace = true
rivet-store.workspace = true
rivet-worker.workspace = true
axum.workspace = true
axum-prometheus.workspace = true
tokio.workspace = true
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
serde_json.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
