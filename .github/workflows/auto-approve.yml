# Auto-approve PRs from org members and Dependabot so the required review
# on `main` is satisfied without a second human. External contributors still
# need a real review. Re-runs on synchronize because stale reviews are dismissed.
name: Auto-approve trusted PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    name: Auto-approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER'
    steps:
      - name: Approve pull request
        run: gh pr review --approve "$PR_URL" --body "Auto-approved for trusted author."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  enable-dependabot-auto-merge:
    name: Enable Dependabot auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: auto-approve
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
