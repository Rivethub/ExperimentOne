name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS runners are not available on free private GitHub plans; Linux + Windows
  # cover the cross-platform surface. Re-add macos-14 when Pro/Team billing is on.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Check control plane
        run: cargo check -p rivet-runtime
      - name: Check CLI
        run: cargo check -p rivet-cli
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p rivet-core -p rivet-api -p rivet-export -p rivet-runtime --lib

  sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/cliproxyapi/go.mod
      - name: gofmt
        working-directory: vendor/cliproxyapi
        run: |
          files="$(gofmt -l ./internal/rivetsink/)"
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi
      - name: Rivet sink tests
        working-directory: vendor/cliproxyapi
        run: go test ./internal/rivetsink/ -count=1

  desktop-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install frontend deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Format check
        working-directory: apps/desktop
        run: bun run fmt:check
      - name: Lint
        working-directory: apps/desktop
        run: bun run lint
      - name: Typecheck
        working-directory: apps/desktop
        run: bun run typecheck

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: "libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf"
          - os: windows-latest
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Install frontend deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Typecheck / build UI
        working-directory: apps/desktop
        run: bun run build
      # tauri-build requires externalBin paths to exist; CI only typechecks, so stub them.
      - name: Stub Tauri sidecars
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          mkdir -p binaries
          case "${{ runner.os }}" in
            Linux)   triple=x86_64-unknown-linux-gnu; ext= ;;
            Windows) triple=x86_64-pc-windows-msvc; ext=.exe ;;
            macOS)   triple=aarch64-apple-darwin; ext= ;;
            *) echo "unsupported OS ${{ runner.os }}"; exit 1 ;;
          esac
          for name in rivetd rivet-proxy clickhouse; do
            path="binaries/${name}-${triple}${ext}"
            printf '#!/bin/sh\necho stub\n' > "$path"
            chmod +x "$path" || true
          done
      - name: Check Tauri crate
        working-directory: apps/desktop/src-tauri
        run: cargo check

  # Single required check for branch rules / auto-merge. Keeps protection stable
  # when matrix legs are renamed or added.
  CI:
    if: always() && !cancelled()
    needs: [rust, sink, desktop-lint, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          results=(
            "${{ needs.rust.result }}"
            "${{ needs.sink.result }}"
            "${{ needs.desktop-lint.result }}"
            "${{ needs.desktop.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "Required job result was '$r' (want success)"
              exit 1
            fi
          done
          echo "All required jobs succeeded"
