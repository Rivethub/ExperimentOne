# Strict lint for Rivet first-party Go (internal/rivetsink only).
# Upstream CLIProxyAPI is not lint-clean; keep `run.paths` narrow.
version: "2"

run:
  relative-path-mode: gomod
  paths:
    - internal/rivetsink
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

severity:
  default: warning

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - noctx
    - paralleltest
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unhandled-error
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
