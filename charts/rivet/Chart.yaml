apiVersion: v2
name: rivet
description: Rivet enterprise stack — control plane, proxy, ClickHouse, NATS, workers, MCP
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ai
  - proxy
  - traffic
  - clickhouse
  - nats
maintainers:
  - name: Rivet
dependencies:
  # Altinity ClickHouse chart (includes the official ClickHouse operator).
  # Extend via values under `clickhouse:` — see values.yaml.
  - name: clickhouse
    version: 0.3.13
    repository: https://helm.altinity.com
    condition: clickhouse.enabled
  # Official NATS chart (JetStream StatefulSet). Prefer this over the legacy
  # nats-operator, which has no JetStream support. Extend via `nats:` values.
  - name: nats
    version: 2.15.2
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
