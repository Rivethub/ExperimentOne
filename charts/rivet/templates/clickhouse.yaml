{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rivet.fullname" . }}-clickhouse
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.service.httpPort }}
            - name: native
              containerPort: {{ .Values.clickhouse.service.nativePort }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: data
          {{- if .Values.clickhouse.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rivet.fullname" . }}-clickhouse
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{- if .Values.clickhouse.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rivet.fullname" . }}-clickhouse
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.clickhouse.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rivet.fullname" . }}-clickhouse
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: http
      port: {{ .Values.clickhouse.service.httpPort }}
      targetPort: http
    - name: native
      port: {{ .Values.clickhouse.service.nativePort }}
      targetPort: native
{{- end }}
