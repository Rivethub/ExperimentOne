# Enterprise deploy values. Local DMG does not use Helm.

nameOverride: ""
fullnameOverride: ""

rivetd:
  replicaCount: 1
  image:
    repository: rivet/rivetd
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    apiPort: 8741
    mcpPort: 8742
  resources: {}

proxy:
  enabled: true
  replicaCount: 2
  image:
    repository: rivet/rivet-proxy
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8317
  resources: {}

# Extends https://helm.altinity.com chart `clickhouse` (Altinity Operator + CHI).
# Set clickhouse.enabled=false and clickhouse.url to point at an external cluster.
clickhouse:
  enabled: true
  # Optional override when using an external / managed ClickHouse instead of the subchart.
  url: ""

  # Install the Altinity operator with this release.
  # Disable if the operator is already installed cluster-wide.
  operator:
    enabled: true

  # Keeper only needed for multi-replica / replicated tables.
  keeper:
    enabled: false

  # Nested `clickhouse:` is the CHI config consumed by the Altinity subchart.
  clickhouse:
    defaultUser:
      # Empty password matches Rivet's unauthenticated HTTP client today.
      # Prefer password_secret_name + URL credentials for production.
      password: ""
      # Required so rivetd/workers can connect (chart default is 127.0.0.1/32).
      allowExternalAccess: true
    replicasCount: 1
    shardsCount: 1
    persistence:
      enabled: true
      size: 50Gi
    service:
      type: ClusterIP

# Role-split Deployments are not ready (meta is process-local; LLM jobs need
# a reachable proxy). Keep false — rivetd runs RIVET_WORKER_ROLE=all.
workers:
  enabled: false
  image:
    repository: rivet/rivetd
    tag: "0.1.0"

mcp:
  enabled: true

ingress:
  enabled: false
  className: ""
  hosts:
    - host: rivet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Teams / admin portal / OIDC — scaffold only
teams:
  enabled: false
  oidc:
    issuer: ""
    clientId: ""

# NATS JetStream job plane (required). Point at a cluster URL before install.
bus:
  enabled: true
  natsUrl: "nats://nats:4222"
