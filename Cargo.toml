[workspace]
resolver = "2"
members = [
  "crates/rivet-core",
  "crates/rivet-store",
  "crates/rivet-ingest",
  "crates/rivet-api",
  "crates/rivet-worker",
  "crates/rivet-mcp",
  "crates/rivet-export",
  "crates/rivet-runtime",
  "crates/rivet-cli",
]
exclude = ["apps/desktop/src-tauri", "vendor"]
default-members = ["crates/rivet-runtime", "crates/rivet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rivet-ai/rivet"
authors = ["Rivet"]
readme = "README.md"
keywords = ["rivet", "proxy", "llm", "traffic"]
categories = ["development-tools"]

[workspace.dependencies]
rivet-core = { path = "crates/rivet-core" }
rivet-store = { path = "crates/rivet-store" }
rivet-ingest = { path = "crates/rivet-ingest" }
rivet-api = { path = "crates/rivet-api" }
rivet-worker = { path = "crates/rivet-worker" }
rivet-mcp = { path = "crates/rivet-mcp" }
rivet-export = { path = "crates/rivet-export" }
rivet-runtime = { path = "crates/rivet-runtime" }
rivet-cli = { path = "crates/rivet-cli" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Explicit features (not `full`) — skips unused crates like process/io-std.
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
dirs = "7"
camino = "1"
futures = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
notify = "8"

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
unused_must_use = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pedantic noise: we are not documenting every error/panic path yet.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Crate/module names intentionally repeat the rivet-* prefix.
module_name_repetitions = "allow"
# Not every pure helper needs #[must_use].
must_use_candidate = "allow"
# Dependency trees may pull multiple semver-compatible versions.
multiple_crate_versions = "allow"
# Third-party error types rarely implement std::error::Error in our graph.
impl_trait_in_params = "allow"

# Faster local/CI compiles: less debug info to generate and link.
# Use `cargo build --release` (unchanged below) when you need full symbols/LTO.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
