[workspace]
resolver = "2"
members = [
  "crates/rivet-core",
  "crates/rivet-store",
  "crates/rivet-ingest",
  "crates/rivet-api",
  "crates/rivet-worker",
  "crates/rivet-mcp",
  "crates/rivet-export",
  "crates/rivet-runtime",
  "crates/rivet-cli",
]
exclude = ["apps/desktop/src-tauri", "vendor"]
default-members = ["crates/rivet-runtime", "crates/rivet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rivet-ai/rivet"
authors = ["Rivet"]

[workspace.dependencies]
rivet-core = { path = "crates/rivet-core" }
rivet-store = { path = "crates/rivet-store" }
rivet-ingest = { path = "crates/rivet-ingest" }
rivet-api = { path = "crates/rivet-api" }
rivet-worker = { path = "crates/rivet-worker" }
rivet-mcp = { path = "crates/rivet-mcp" }
rivet-export = { path = "crates/rivet-export" }
rivet-runtime = { path = "crates/rivet-runtime" }
rivet-cli = { path = "crates/rivet-cli" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
dirs = "7"
camino = "1"
futures = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
notify = "8"

[profile.release]
lto = "thin"
codegen-units = 1
